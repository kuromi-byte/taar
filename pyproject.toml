[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gap-to-brief"
version = "0.1.0"
description = "Rural Coverage Gap Mapper (Gap-to-Brief)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "api*"]
